plugins {
	id 'java-library'
	id 'com.gradleup.shadow' version '9.6.1'
	id 'maven-publish'
}

compileJava.options.encoding = "UTF-8"

allprojects {
	group 'me.seafoam.minecraft'
	version '1.1.1'

	repositories {
		mavenCentral()
		maven {url 'https://repo.papermc.io/repository/maven-public/'}
		maven {url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'}
		maven {url 'https://repo.dmulloy2.net/repository/public/'}
		maven {url 'https://libraries.minecraft.net/'}
		maven {url 'https://repo.codemc.io/repository/maven-snapshots/'}
		maven {url 'https://repo.seafoam.me'}
		maven {url 'https://jitpack.io'}
		maven {url 'https://m2.dv8tion.net/releases'}
	}
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'com.gradleup.shadow'
	apply plugin: 'maven-publish'

	dependencies {
		compileOnlyApi 'net.kyori:adventure-api:5.2.0'
		compileOnlyApi 'net.kyori:adventure-text-minimessage:5.2.0'
		compileOnlyApi 'net.kyori:adventure-text-serializer-legacy:5.2.0'
		compileOnlyApi 'net.kyori:adventure-text-serializer-gson:5.2.0'
		compileOnlyApi 'com.google.code.gson:gson:2.9.1'
		compileOnlyApi 'com.google.code.findbugs:jsr305:3.0.2'
		compileOnlyApi 'org.projectlombok:lombok:1.18.34'
		compileOnlyApi 'com.google.guava:guava:31.1-jre'
		compileOnlyApi 'org.jetbrains:annotations:22.0.0'

		annotationProcessor 'org.projectlombok:lombok:1.18.48'
	}

	tasks.withType(JavaCompile) {
		options.encoding = 'UTF-8'
		options.release = 25
	}

	publishing {
		repositories {
			maven {
				name = 'seafoamy'
				url = 'https://repo.seafoam.me'
				credentials {
					username = findProperty('clientId')
					password = findProperty('clientSecret')
				}
			}
		}

		publications {
			mavenJava(MavenPublication) {
				from components.java
			}
		}
	}
}
